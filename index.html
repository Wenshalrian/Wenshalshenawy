<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشناوي لإنقاذ السيارات - أسرع ونش سيارات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }
        .btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>الشناوي لإنقاذ السيارات</h1>
        <p>خدمة إنقاذ وسحب سيارات سريعة وآمنة على مدار الساعة.</p>
        <a href="tel:01000000000" class="btn">اتصل بالونش الآن</a>

</html>
